schema: spec-driven

context: |
  Language: cs
  All artifacts must be written in cs.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Projekt: Appdílna, „Přání s talismanem“. Zdroj pravdy je docs/ZADANI.md,
  odchylky se zapisují do docs/ROZHODNUTI.md, známá omezení do docs/ZNAME-PROBLEMY.md.
  Stack: Next.js (App Router), TypeScript, Tailwind, three.js, model-viewer,
  PostgreSQL + Drizzle, Stripe Checkout, Resend, Docker za nginx na VPS.
  Trvalé požadavky pro každou změnu: specs/security, specs/discoverability a specs/performance.
  Žádné vymyšlené údaje (recenze, počty prodejů, nedostatek zboží).

rules:
  proposal:
    - Uveď, kterou kapitolu docs/ZADANI.md změna naplňuje.
    - Uveď sekci „Dopad na bezpečnost“, „Dopad na SEO/GEO/AEO“ a „Dopad na výkon“, i kdyby byl dopad žádný.
  tasks:
    - Každý úkol odkazuje na beads ID (app-xxx). Stav se vede v beads, ne v tasks.md.
    - Úkol s kódem obsahuje i způsob ověření (test nebo kontrola na zařízení).

operations:
  apply:
    guidance:
      - Před prací spusť bd ready a vezmi si úkol přes bd update --claim.
      - Hotovo znamená, že prošlo npm run check. Kontrolu na reálném zařízení, která neproběhla, přiznej.
